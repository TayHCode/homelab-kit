[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-kit"
version = "0.2.0"
description = "Private homelab Markdown documentation"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
homelab-kit = "homelab_kit.cli:main"

[tool.setuptools]
packages = ["homelab_kit"]
include-package-data = false

[tool.setuptools.package-data]
homelab_kit = ["data/**/*"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
